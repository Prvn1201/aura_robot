controller_manager:
  ros__parameters:
    update_rate: 100  # Hz - matches typical Gazebo physics step rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rear_wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    front_steering_position_controller:
      type: position_controllers/JointGroupPositionController

# Rear axle: single DC motor, velocity-controlled, drives both rear wheels.
# Step 10's Ackermann controller node publishes the same target angular
# velocity to both joints here.
rear_wheel_velocity_controller:
  ros__parameters:
    joints:
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: velocity

# Front axle: single steering servo, position-controlled.
# Step 10's Ackermann controller node publishes the computed steering
# angle(s) here (equal angles for now; true per-wheel Ackermann angles
# can be added later without touching this config).
front_steering_position_controller:
  ros__parameters:
    joints:
      - front_left_steering_joint
      - front_right_steering_joint
    interface_name: position
    

